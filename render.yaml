services:
  - type: web
    name: zex-shop
    env: python
    buildCommand: pip install --only-binary=:all: -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_BASE
        sync: false
