services:
  - type: web
    name: lwox-gold-bot
    runtime: python
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_BASE
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_USERNAME
        value: lwox_org
      - key: GOLD_RATE
        value: "105"
      - key: DB_PATH
        value: bot.db
